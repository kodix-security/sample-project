name: Kodix Security + Compliance Scan

on:
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

jobs:
  security-scan:
    name: 🛡️ Kodix AI Security + Compliance Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Requires a compliance document on your Kodix account first: Profile → Compliance → upload
      # CODING_STANDARDS.md (or click "Try a sample document"). Without one, this step fails with
      # "no_compliance_documents" — see README.md → "Testing the Compliance Check".
      - name: Run Kodix Security + Compliance Scan
        uses: kodix-security/kodix-action@v1
        with:
          api_key: ${{ secrets.KODIX_API_KEY }}
          code_scan: true
          compliance_scan: true
